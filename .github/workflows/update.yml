name: ProFolio Auto Data Sync

on:
  schedule:
    # Runs every 30 minutes during market hours
    - cron: '*/30 1-13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Price Update Script
        run: python update_data.py

      - name: Commit and Push Changes to GitHub Pages
        run: |
          git config --global user.name "ProFolio Bot"
          git config --global user.email "bot@profolio.io"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update TW/US stock prices and exchange rate [skip ci]" && git push)
